[workspace]
resolver = "2"
members = ["crates/vorax", "crates/vorax-cli", "crates/vorax-scan", "crates/vorax-overlay"]

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.test]
opt-level = 3
