[package]
name = "vorax-scan"
description = "Screen reader for the Vorax minigame: a Surgical Preparation frame into the Solver's ScreenState"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vorax = { path = "../vorax" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
base64 = "0.22"
libm = "0.2"
rayon = "1"

[dev-dependencies]
png = "0.17"
