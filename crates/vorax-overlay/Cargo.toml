[package]
name = "vorax-overlay"
description = "A minimal read-only overlay for the Vorax minigame: marks the card and tanks to pick over the game"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vorax-overlay"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
vorax = { path = "../vorax" }
vorax-scan = { path = "../vorax-scan" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"
fontdue = "0.9"
png = "0.17"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_HiDpi",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Web_Http",
  "Web_Http_Headers",
]
