[package]
name = "vorax"
description = "Rust port of the tli-vorax-simulator engine, bot and advisor (read-only advice; never plays the game)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rayon = "1"
# fdlibm's log1p, the same algorithm V8's Math.log1p uses, so board values match the TypeScript ones bit for bit
libm = "0.2"
